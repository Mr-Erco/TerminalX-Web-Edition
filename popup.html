<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal X Web Companion</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body class="theme-terminal-x">
    <div class="app-container">
        <!-- Sidebar / Left Panel -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="icon.png" alt="Logo" class="logo">
                <span class="brand-name">TerminalX</span>
                <a href="https://github.com/Mr-Erco" target="_blank" class="github-link">
                    <svg height="20" viewBox="0 0 16 16" width="20" class="github-icon"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>
                </a>
            </div>
            
            <div class="theme-selector-container">
                <label for="themeSelect">Theme</label>
                <select id="themeSelect">
                    <option value="theme-terminal-x">Terminal X (Grey & Black)</option>
                    <option value="theme-cyberpunk">Cyberpunk Neon</option>
                    <option value="theme-matrix">Matrix Digital</option>
                    <option value="theme-dracula">Dracula Dark</option>
                </select>
            </div>

            <button class="btn btn-primary btn-new-script">+ New Script</button>
            
            <div class="script-list-container">
                <ul class="script-list" id="scriptList">
                    <!-- Dynamic Content -->
                </ul>
            </div>
        </aside>

        <!-- Main / Right Panel -->
        <main class="main-content">
            <header class="editor-header">
                <div class="header-inputs">
                    <div class="input-group">
                        <label for="scriptName">Script Name</label>
                        <input type="text" id="scriptName" placeholder="My Script">
                    </div>
                    <div class="input-group">
                        <label for="matchPattern">Match Pattern</label>
                        <input type="text" id="matchPattern" placeholder="*://*.google.com/*">
                    </div>
                </div>
                <div class="action-buttons">
                    <button class="btn btn-secondary" id="saveBtn">Save</button>
                    <button class="btn btn-accent" id="runBtn">Run</button>
                </div>
            </header>

            <div class="editor-container">
                <div class="editor-line-numbers">
                    <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span><span>11</span><span>12</span><span>13</span><span>14</span><span>15</span>
                </div>
                <textarea class="code-editor" id="codeEditor" spellcheck="false"></textarea>
            </div>

            <footer class="terminal-section">
                <div class="terminal-header">
                    <span>Terminal Output</span>
                    <button class="btn-clear" id="clearTerminal">Clear</button>
                </div>
                <div class="terminal-output" id="terminalOutput"></div>
            </footer>
        </main>
    </div>
    <script src="popup.js"></script>
</body>
</html>
